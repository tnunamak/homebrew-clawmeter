name: Update Formula

on:
  schedule:
    - cron: '0 */6 * * *'  # every 6 hours
  repository_dispatch:
    types: [update-formula]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.9.5)"
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get latest release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          elif [ -n "${{ github.event.client_payload.tag }}" ]; then
            TAG="${{ github.event.client_payload.tag }}"
          else
            TAG=$(gh release view --repo tnunamak/clawmeter --json tagName -q '.tagName')
          fi
          VERSION="${TAG#v}"
          SHA=$(curl -fsSL "https://github.com/tnunamak/clawmeter/archive/refs/tags/${TAG}.tar.gz" | sha256sum | cut -d' ' -f1)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Update formula
        run: |
          sed -i "s|url \".*\"|url \"https://github.com/tnunamak/clawmeter/archive/refs/tags/${{ steps.release.outputs.tag }}.tar.gz\"|" Formula/clawmeter.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.release.outputs.sha }}\"|" Formula/clawmeter.rb

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/clawmeter.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update clawmeter to ${{ steps.release.outputs.tag }}"
          git push
